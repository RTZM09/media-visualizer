<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Media Visualizer by RTZ</title>
  <style>
    :root {
      /* The palette itself now lives in src/palette.js — one list shared by
         the sphere and this box, so there's nothing to keep in sync by hand.
         The value below is just the pre-JS default (purple); src/color-menu.js
         overwrites it as soon as the saved color loads, and again every time
         you pick a new one with `s`. */
      --box-color-rgb: 170, 102, 255;
    }

    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    /* The window is dragged from anywhere on it, tracked in JS rather than
       with a `-webkit-app-region: drag` region — a native region swallows
       mousedown, which would break click-the-sphere-to-play/pause. See
       src/window-drag.js. user-select stops a drag across the now-playing
       text from selecting it. */
    body { user-select: none; -webkit-user-select: none; }
    #scene { position: fixed; inset: 0; }
    canvas { display: block; }

    /* Whole-window feedback while a drag is in flight, overriding the
       per-element cursors underneath it. */
    body.dragging, body.dragging * { cursor: grabbing !important; }

    /* Echoes the sphere's look: same pink dots, but with no defined edge —
       the dot field itself thins out and dims into the dark, standing in
       for a border instead of a drawn line. Sizes use clamp() so the whole
       box scales down smoothly as the window shrinks, not just its max-width. */
    #now-playing {
      position: fixed; bottom: clamp(14px, 3vw, 28px); left: 50%; transform: translateX(-50%);
      z-index: 10; max-width: 70vw;
      display: flex; align-items: center; gap: clamp(6px, 1.4vw, 14px);
      font: clamp(11px, 1.3vw, 13px)/1.4 system-ui, sans-serif; color: #cfe8ff;
      padding: clamp(8px, 1.6vw, 16px) clamp(14px, 2.6vw, 28px);
      opacity: 0; transition: opacity 0.4s ease;
      pointer-events: none;
    }
    #now-playing.visible { opacity: 1; }
    #now-playing::before {
      content: '';
      position: absolute;
      inset: clamp(-30px, -6vw, -60px); /* extends well past the text so the dots have room to fade out into space */
      background-image: radial-gradient(circle, rgba(var(--box-color-rgb), 0.75) 1px, transparent 1.4px);
      background-size: 4px 4px;
      -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 72%);
      mask-image: radial-gradient(ellipse at center, black 20%, transparent 72%);
      pointer-events: none;
      z-index: -1;
    }
    #np-text { text-align: center; min-width: 0; flex: 1; }
    #np-title {
      font-size: clamp(12px, 1.5vw, 14px); font-weight: 600; color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #np-artist { font-size: clamp(10px, 1.2vw, 12px); color: #fff; margin-top: 2px; }
    /* Ad mode: no artist line, so the title alone sits centered in the box
       (the box's padding is symmetric top/bottom). */
    #now-playing.ad #np-artist { display: none; }

    .np-btn {
      flex: none; width: clamp(20px, 2.6vw, 26px); height: clamp(20px, 2.6vw, 26px);
      border-radius: 50%; border: none; cursor: pointer;
      background: rgba(var(--box-color-rgb), 0.18); color: #fff;
      font: clamp(10px, 1.2vw, 12px)/1 system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
      pointer-events: auto;
      transition: background 0.15s ease;
    }
    .np-btn:hover { background: rgba(var(--box-color-rgb), 0.4); }

    /* Color picker (press `s`). Sits top-center, clear of the drag handle
       above it and the now-playing box below, and borrows the same dot-field
       halo as that box so it reads as part of the same app. */
    #color-menu {
      position: fixed; top: clamp(30px, 7vw, 44px); left: 50%; transform: translateX(-50%);
      z-index: 15;
      /* width: max-content is load-bearing — `left: 50%` leaves only half the
         viewport as available width, so a shrink-to-fit box would wrap the row
         at half the space it actually has. max-width still lets it wrap on a
         genuinely narrow window. */
      width: max-content; max-width: 88vw;
      display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
      gap: clamp(5px, 1.2vw, 10px);
      padding: clamp(7px, 1.4vw, 13px) clamp(10px, 2vw, 18px);
      opacity: 0; transition: opacity 0.2s ease;
      pointer-events: none;
    }
    #color-menu.visible { opacity: 1; }
    #color-menu::before {
      content: '';
      position: absolute;
      inset: clamp(-24px, -5vw, -48px);
      background-image: radial-gradient(circle, rgba(var(--box-color-rgb), 0.75) 1px, transparent 1.4px);
      background-size: 4px 4px;
      -webkit-mask-image: radial-gradient(ellipse at center, black 18%, transparent 70%);
      mask-image: radial-gradient(ellipse at center, black 18%, transparent 70%);
      pointer-events: none;
      z-index: -1;
    }
    /* The swatches are the only part that takes clicks — the container stays
       transparent to them so the sphere behind it is still clickable. */
    .swatch {
      flex: none; width: clamp(15px, 2.2vw, 22px); height: clamp(15px, 2.2vw, 22px);
      border-radius: 50%; border: none; padding: 0; cursor: pointer;
      pointer-events: auto;
      opacity: 0.65;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    .swatch:hover { opacity: 1; transform: scale(1.15); }
    .swatch.active { opacity: 1; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9); }

    /* Brief "Instrumental only" / "Full mix" note when `v` is pressed. It sits
       where the colour menu does and wears the same dot halo. */
    #mode-toast {
      position: fixed; top: clamp(30px, 7vw, 44px); left: 50%; transform: translateX(-50%);
      z-index: 14; width: max-content; max-width: 88vw;
      font: 600 clamp(11px, 1.4vw, 13px)/1.4 system-ui, sans-serif; color: #fff;
      padding: clamp(6px, 1.2vw, 10px) clamp(12px, 2.2vw, 20px);
      opacity: 0; transition: opacity 0.25s ease;
      pointer-events: none;
    }
    #mode-toast.visible { opacity: 1; }
    #mode-toast::before {
      content: '';
      position: absolute;
      inset: clamp(-18px, -4vw, -36px);
      background-image: radial-gradient(circle, rgba(var(--box-color-rgb), 0.75) 1px, transparent 1.4px);
      background-size: 4px 4px;
      -webkit-mask-image: radial-gradient(ellipse at center, black 18%, transparent 70%);
      mask-image: radial-gradient(ellipse at center, black 18%, transparent 70%);
      pointer-events: none;
      z-index: -1;
    }
  </style>
</head>
<body>
  <div id="scene"></div>

  <div id="color-menu" aria-hidden="true"></div>

  <div id="mode-toast" aria-live="polite"></div>

  <div id="now-playing">
    <button id="np-prev" class="np-btn" aria-label="Previous track">&#9664;</button>
    <div id="np-text">
      <div id="np-title"></div>
      <div id="np-artist"></div>
    </div>
    <button id="np-next" class="np-btn" aria-label="Next track">&#9654;</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
